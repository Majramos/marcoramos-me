[project]
name = "marcoramos-me"
version = "0.1.1"
description = "Simple static single-page site built with HTML, CSS, and Python"
readme = "README.md"
authors = [
    { name = "Marco Ramos", email = "buildsite@marcoramos.me" }
]
requires-python = ">=3.13"
dependencies = [
    "fpdf2>=2.9.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scripts"
module-root = ""

[tool.mypy]
python_version = "3.13"
files = ["scripts", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
