<section id="projects">
    <div class="title">
        <h2>PROJECTS</h2>
    </div>

    <div
        class="projects-carousel"
        aria-label="Project carousel"
        role="region"
        tabindex="0"
    >
        {% for project in projects %}
        <article id="{{ project.id }}" class="project-card">
            <a href="{{ project.url }}">
                <div class="project-card__meta">
                    <span>{{ project.name }}</span>
                </div>

                <div class="project-card__content">
                    <h3>{{ project.name | replace('-', ' ') | title }}</h3>
                    <p>{{ project.description }}</p>

                    <div class="project-card__keywords">
                        {% for keyword in project.keywords %}
                        <span>{{ keyword }}</span>
                        {% endfor %}
                    </div>
                </div>
            </a>
        </article>
        {% endfor %}
    </div>
</section>
