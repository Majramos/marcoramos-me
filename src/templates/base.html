<!doctype html>
<html lang="en">
    <head>
        <title>{{ title }}</title>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <meta name="description" content="{{ description }}" />

        <meta name="author" content="Marco Ramos" />
        <meta name="description" content="{{ description }}" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Marco Ramos" />
        <meta name="application-name" content="Marco Ramos" />
        <meta name="robots" content="index, follow" />
        <meta name="googlebot" content="notranslate" />

        <meta property="og:title" content="{{ title }}" />
        <meta property="og:description" content="{{ description }}" />
        <meta property="og:image" content="./img/apple-touch-icon.png" />
        <meta property="og:image:alt" content="Image of the letter M" />
        <meta property="og:url" content="https://{{ base_url }}" />
        <meta property="og:site_name" content="Marco Ramos" />

        <meta name="twitter:title" content="{{ title }}" />
        <meta name="twitter:description" content="{{ description }}" />
        <meta name="twitter:image:src" content="./img/apple-touch-icon.png" />
        <meta name="twitter:image:alt" content="Image of the letter M" />
        <meta name="twitter:url" content="https://{{ base_url }}" />
        <meta name="twitter:site" content="@majramos" />

        <link rel="canonical" href="{{ base_url }}" />

        <link rel="icon" href="./img/favicon.ico" />


        <link rel="stylesheet" href="./css/style.css" />
        <script src="./js/script.js" defer></script>
    </head>
    <body>
        {% include "navbar.html" %}
        <main id="content">
            {% block content %}{% endblock %}
        </main>
        {% include "footer.html" %}
    </body>
</html>
